name: Resource health checks

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resource-health-checks
  cancel-in-progress: false

jobs:
  check-resources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      RESOURCE_CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.RESOURCE_CREDENTIAL_ENCRYPTION_KEY }}
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
      EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
      EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
      EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
      EMAIL_USE_TLS: ${{ secrets.EMAIL_USE_TLS || 'true' }}
      EMAIL_USE_SSL: ${{ secrets.EMAIL_USE_SSL || 'false' }}
      DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project requirements
        run: python -m pip install -r requirements.txt

      - name: Validate required configuration
        run: |
          python -c 'import os, sys; required = ("DATABASE_URL", "SECRET_KEY", "RESOURCE_CREDENTIAL_ENCRYPTION_KEY", "EMAIL_HOST", "EMAIL_PORT", "DEFAULT_FROM_EMAIL"); missing = [key for key in required if not os.getenv(key)]; print("Missing required GitHub Actions secrets: " + ", ".join(missing) if missing else "Required configuration is present"); sys.exit(bool(missing))'

      - name: Check database migrations
        run: python manage.py migrate --check

      - name: Check monitored resources
        run: python manage.py check_resources --timeout 10
